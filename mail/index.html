<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Studio People Mail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400&display=swap" rel="stylesheet">
  <style>
    :root{--blue:#426791;--deep:#294967;--ink:#263746;--muted:#718398;--line:rgba(66,103,145,.16)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fff 0%,#f8fbfe 58%,#edf4fa 100%);display:flex;flex-direction:column}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(-25deg,rgba(66,103,145,.025) 0 2px,transparent 2px 28px);z-index:-1}
    header{height:76px;padding:0 clamp(20px,5vw,64px);display:flex;align-items:center;border-bottom:1px solid var(--line);background:rgba(255,255,255,.72);backdrop-filter:blur(14px)}
    .brand{font-family:"Bodoni Moda","Times New Roman",serif;font-size:clamp(29px,4vw,40px);color:var(--blue);text-decoration:none;line-height:1}
    .brand small{display:block;margin-top:5px;font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.25em;color:var(--muted)}
    main{flex:1;width:min(460px,calc(100% - 36px));margin:0 auto;display:flex;align-items:center;padding:54px 0}
    .login{width:100%;padding:clamp(25px,6vw,42px);background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px rgba(42,73,104,.08);backdrop-filter:blur(12px)}
    .eyebrow{font-size:10px;letter-spacing:.24em;font-weight:750;color:#7892ac}
    h1{font-size:clamp(32px,7vw,42px);line-height:1.15;letter-spacing:.01em;color:var(--deep);font-weight:600;margin:13px 0 10px}
    .intro{font-size:13px;line-height:1.9;color:var(--muted);margin:0 0 27px}
    .google-button{width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid #d7dfe7;border-radius:13px;background:#fff;color:#34495e;font:inherit;font-size:13px;font-weight:650;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
    .google-button:hover:not(:disabled){transform:translateY(-1px);border-color:#a8bbce;box-shadow:0 8px 22px rgba(42,73,104,.08)}
    .google-button:disabled{opacity:.55;cursor:not-allowed}
    .google-mark{font-weight:800;font-size:19px;font-family:Arial,sans-serif;color:#4285f4}
    .status{margin-top:18px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#f4f7fa;color:#63798e;font-size:11px;line-height:1.85;overflow-wrap:anywhere}
    .status strong{color:var(--deep)}
    .account{margin-top:19px;font-size:12px;line-height:1.8;color:#6d8297}
    .logout{display:none;width:100%;margin-top:12px;min-height:43px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--deep);font:inherit;cursor:pointer}
    .back{display:inline-block;margin-top:23px;color:#6d8297;text-decoration:none;font-size:12px;transition:color .2s}
    .back:hover{color:var(--blue)}
    footer{text-align:center;border-top:1px solid var(--line);padding:20px;color:#8293a3;font-size:10px;letter-spacing:.08em}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="../index.html">Studio People<small>MAIL WORKSPACE</small></a>
  </header>
  <main>
    <section class="login" aria-labelledby="login-title">
      <div class="eyebrow">PRIVATE AREA / ADMIN</div>
      <h1 id="login-title">Welcome back.</h1>
      <p class="intro">Studio People Mail の管理画面です。Googleアカウントで管理者確認を行います。</p>
      <button class="google-button" id="google-login" type="button"><span class="google-mark" aria-hidden="true">G</span>Googleで管理者ログイン</button>
      <div class="status" id="status" role="status" aria-live="polite"><strong>接続設定が必要です</strong><br>認証サービスの設定後、このボタンからログインできるようになります。</div>
      <div class="account" id="account-info" hidden></div>
      <button class="logout" id="logout" type="button">ログアウト</button>
      <a class="back" href="../index.html">← Studio People に戻る</a>
    </section>
  </main>
  <footer>© Studio People · PRIVATE MAIL WORKSPACE</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Add your Supabase Project URL and publishable key here after creating the project.
    // These client-side values are intended to be public. Never put a service_role/secret key here.
    const SUPABASE_URL = "https://qmwfmtaeoeyvuphtelmf.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uA6bciEj-zRAcQZOAJWbJQ_AbDT-zGA";
    const ADMIN_EMAIL = "studio.people.web@gmail.com";

    const loginButton = document.getElementById("google-login");
    const logoutButton = document.getElementById("logout");
    const statusBox = document.getElementById("status");
    const accountInfo = document.getElementById("account-info");
    const configured = SUPABASE_URL.startsWith("https://") &&
      !SUPABASE_URL.includes("PASTE_") &&
      SUPABASE_PUBLISHABLE_KEY &&
      !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_") &&
      window.supabase;

    function showStatus(title, message) {
      statusBox.replaceChildren();
      const strong = document.createElement("strong");
      strong.textContent = title;
      statusBox.append(strong, document.createElement("br"), document.createTextNode(message));
    }

    if (!configured) {
      loginButton.disabled = true;
      showStatus("あと一度、接続設定が必要です", "SupabaseのProject URLとPublishable keyが未設定です。認証サービスを作成して値を設定すると、Googleログインを有効にできます。");
    } else {
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

      async function checkSession() {
        const { data, error } = await client.auth.getUser();
        if (error || !data.user) return;
        const email = (data.user.email || "").toLowerCase();
        if (email !== ADMIN_EMAIL) {
          await client.auth.signOut();
          showStatus("このアカウントは許可されていません", "管理者として許可されたアカウントではありません。ログアウトして、別のGoogleアカウントでお試しください。");
          return;
        }
        showStatus("管理者としてログイン中", "管理者認証が完了しました。");
        loginButton.style.display = "none";
        accountInfo.hidden = true;
        logoutButton.style.display = "block";
      }

      loginButton.addEventListener("click", async () => {
        loginButton.disabled = true;
        showStatus("Googleへ移動します", "アカウントを選択してください。");
        const { error } = await client.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: window.location.href.split("?")[0].split("#")[0] }
        });
        if (error) {
          showStatus("ログインを開始できませんでした", error.message);
          loginButton.disabled = false;
        }
      });

      logoutButton.addEventListener("click", async () => {
        const { error } = await client.auth.signOut();
        if (error) showStatus("ログアウトに失敗しました", error.message);
        else window.location.reload();
      });

      checkSession();
    }
  </script>
</body>
</html>
