<body>

<!-- ========================================

<!-- ========================================
     JavaScript
======================================== -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        /* ====================================
           要素取得
        ==================================== */
        const menuButton =
            document.getElementById("menuButton");
        const menuPanel =
            document.getElementById("menuPanel");
        const menuBackdrop =
            document.getElementById("menuBackdrop");
        /* ====================================
           ページ表示
        ==================================== */
        /*
            CSS側では最初、
            opacity: 0;
            filter: blur(10px);
            になっている。
            ここで page-loaded を追加して
            通常表示に戻す。
        */
        requestAnimationFrame(function () {
            document.body.classList.add("page-loaded");
        });
        /* ====================================
           メニューを閉じる関数
        ==================================== */
        function closeMenu() {
            menuButton.classList.remove("active");
            menuPanel.classList.remove("active");
            menuBackdrop.classList.remove("active");
            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );
        }
        /* ====================================
           メニューを開く / 閉じる
        ==================================== */
        menuButton.addEventListener(
            "click",
            function () {
                const isOpen =
                    menuPanel.classList.toggle("active");
                menuButton.classList.toggle(
                    "active",
                    isOpen
                );
                menuBackdrop.classList.toggle(
                    "active",
                    isOpen
                );
                menuButton.setAttribute(
                    "aria-expanded",
                    String(isOpen)
                );
            }
        );
        /* ====================================
           背景をクリックしたら閉じる
        ==================================== */
        menuBackdrop.addEventListener(
            "click",
            function () {
                closeMenu();
            }
        );
        /* ====================================
           ESCキーで閉じる
        ==================================== */
        document.addEventListener(
            "keydown",
            function (event) {
                if (event.key === "Escape") {
                    closeMenu();
                }
            }
        );
        /* ====================================
           ページ遷移
        ==================================== */
        /* ====================================
           ページ遷移
           Web Animations APIでフェードアウト完了後に移動
        ==================================== */
        let isLeaving = false;
        document.addEventListener("click", function (event) {
            const link = event.target && event.target.closest
                ? event.target.closest("a[href]")
                : null;
            if (!link || isLeaving) return;

            if (
                event.button !== 0 ||
                event.metaKey || event.ctrlKey ||
                event.shiftKey || event.altKey ||
                link.target === "_blank" ||
                link.hasAttribute("download")
            ) return;

            let destination;
            try {
                destination = new URL(link.href, window.location.href);
            } catch (_) {
                return;
            }

            if (destination.origin !== window.location.origin) return;
            if (destination.pathname === window.location.pathname &&
                destination.search === window.location.search) return;

            event.preventDefault();
            event.stopImmediatePropagation();
            isLeaving = true;
            closeMenu();

            const reduceMotion = window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            ).matches || document.body.classList.contains("sp-reduce-motion");

            if (reduceMotion || typeof document.body.animate !== "function") {
                window.location.assign(destination.href);
                return;
            }

            const body = document.body;
            const currentOpacity = getComputedStyle(body).opacity;
            const fade = body.animate(
                [{ opacity: currentOpacity }, { opacity: 0 }],
                { duration: 800, easing: "ease", fill: "forwards" }
            );

            fade.finished.then(function () {
                window.location.assign(destination.href);
            }).catch(function () {
                window.location.assign(destination.href);
            });
        }, true);
    });
</script>
    <script src="articles.js"></script>
<script src="motion.js?v=1"></script>
    <script src="settings.js?v=5"></script>
</body>
</html>
