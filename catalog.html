<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATALOG | people stationery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ========================================
         ヘッダー
    ======================================== -->
    <header>
        <div class="header-inner">
            <a href="index.html" class="logo">
                people stationery
            </a>
            <button class="menu-button" aria-label="メニュー">
                ☰
            </button>
        </div>
    </header>
    <!-- ========================================
         CATALOG
    ======================================== -->
    <main class="catalog">
        <section class="catalog-header">
            <p class="catalog-label">STATIONERY CATALOG</p>
            <h1>CATALOG</h1>
            <p class="catalog-description">
                people stationeryに登場する文房具を、
                カタログ形式でまとめています。
            </p>
        </section>
        <!-- ========================================
             CATEGORY
        ======================================== -->
        <section class="catalog-section">
            <h2>CATEGORY</h2>
            <div class="category-list">
                <a href="#" class="category-item">
                    <span>SHARP PENCIL</span>
                    <small>シャープペンシル</small>
                </a>
                <a href="#" class="category-item">
                    <span>BALLPOINT PEN</span>
                    <small>ボールペン</small>
                </a>
                <a href="#" class="category-item">
                    <span>FOUNTAIN PEN</span>
                    <small>万年筆</small>
                </a>
                <a href="#" class="category-item">
                    <span>OTHER</span>
                    <small>その他</small>
                </a>
            </div>
        </section>
        <!-- ========================================
             ITEM LIST
        ======================================== -->
        <section class="catalog-section">
            <div class="catalog-section-title">
                <h2>ITEMS</h2>
                <span class="item-count">
                    0 ITEMS
                </span>
            </div>
            <div class="catalog-grid">
                <!--
                文房具を追加するときは
                このカードをコピーして使う
                -->
                <article class="catalog-card">
                    <a href="#">
                        <div class="catalog-card-image">
                            <!-- 画像 -->
                        </div>
                        <div class="catalog-card-info">
                            <p class="catalog-card-category">
                                SHARP PENCIL
                            </p>
                            <h3>
                                KURUTOGA Dive
                            </h3>
                            <p class="catalog-card-color">
                                Grand Blue
                            </p>
                        </div>
                    </a>
                </article>
            </div>
        </section>
    </main>
    <!-- ========================================
         FOOTER
    ======================================== -->
    <footer>
        <p>© people stationery</p>
    </footer>
</body>
</html>
