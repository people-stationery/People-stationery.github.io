<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">

    <title>ARTICLE | studio people</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=play-1">
</head>

<body>
<div class="page-line"></div>
<header>
    <div class="header-inner">

        <a href="index.html" class="logo">
            Studio People
        </a>

        <button
            class="menu-button"
            id="menuButton"
            aria-label="メニュー"
            aria-expanded="false"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>
</header>


<div class="menu-backdrop" id="menuBackdrop"></div>


<nav
    class="menu-panel"
    id="menuPanel"
    aria-label="メインメニュー"
>
    <a href="index.html">
        HOME
    </a>

    <a href="article.html">
        ARTICLE
    </a>

    <a href="catalog.html">
        CATALOG
    </a>

    <a href="about.html">
        ABOUT
    </a>
</nav>

<main class="article-page">

    <section class="hero">

        <p class="small-title">
            ARTICLE
        </p>

        <h1>
            記事一覧
        </h1>

        <p class="description">
            人文房具の記事をまとめています。
        </p>

    </section>


    <section class="articles">

        <h2>
            記事一覧
        </h2>


        <div class="article-list" id="articleList"></div>

    </section>

</main>


<footer class="site-footer">
    <nav class="footer-links" aria-label="フッター">
        <a href="company.html">会社概要・採用情報</a>
        <span aria-hidden="true">/</span>
        <a href="privacy.html">プライバシーポリシー</a>
        <span aria-hidden="true">/</span>
        <a href="contact.html">お問い合わせ</a>
    </nav>
    <p class="footer-operator">運営会社：<span class="footer-company-name">Stardio</span></p>
    <p class="footer-copyright">© Studio People</p>
</footer>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const menuButton =
            document.getElementById("menuButton");

        const menuPanel =
            document.getElementById("menuPanel");

        const menuBackdrop =
            document.getElementById("menuBackdrop");


        requestAnimationFrame(
            function () {

                document.body.classList.add(
                    "page-loaded"
                );

            }
        );


        function closeMenu() {

            menuButton.classList.remove("active");

            menuPanel.classList.remove("active");

            menuBackdrop.classList.remove("active");

            menuButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }


        menuButton.addEventListener(
            "click",
            function () {

                const isOpen =
                    menuPanel.classList.toggle("active");


                menuButton.classList.toggle(
                    "active",
                    isOpen
                );


                menuBackdrop.classList.toggle(
                    "active",
                    isOpen
                );


                menuButton.setAttribute(
                    "aria-expanded",
                    String(isOpen)
                );

            }
        );


        menuBackdrop.addEventListener(
            "click",
            function () {

                closeMenu();

            }
        );


        document.addEventListener(
            "keydown",
            function (e) {

                if (e.key === "Escape") {

                    closeMenu();

                }

            }
        );


        /* ページ遷移は共通の page-transition.js に一本化 */


        const articleCards =
            document.querySelectorAll(
                ".article-page .article-card"
            );


        const articleObserver =
            new IntersectionObserver(
                function (entries) {

                    entries.forEach(
                        function (entry) {

                            if (
                                entry.isIntersecting
                            ) {

                                entry.target.classList.add(
                                    "is-visible"
                                );

                                articleObserver.unobserve(
                                    entry.target
                                );

                            }

                        }
                    );

                },
                {
                    threshold: 0.15
                }
            );


        articleCards.forEach(
            function (card) {

                articleObserver.observe(card);

            }
        );

    }
);

</script>


    <script src="articles.js"></script>
<script src="motion.js?v=1"></script>
    <script src="settings.js?v=global-search-1"></script>

<script src="page-transition.js?v=1"></script>
</body>
</html>
