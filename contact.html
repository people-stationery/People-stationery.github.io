<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Studio Peopleへのお問い合わせはこちら。">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <title>お問い合わせ | Studio People</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=play-1">
  <style>
    .contact-content{width:min(760px,calc(100% - 40px));margin:0 auto 100px}
    .contact-intro{line-height:1.9;color:#63798e;margin:0 0 30px}
    .contact-form{display:grid;gap:20px}
    .contact-field{display:grid;gap:8px}
    .contact-field label,.contact-label{font-size:13px;font-weight:650;color:#34495e}
    .contact-field input,.contact-field select,.contact-field textarea{width:100%;font:inherit;font-size:15px;color:#263746;background:rgba(255,255,255,.9);border:1px solid rgba(66,103,145,.25);border-radius:10px;padding:13px 14px;outline:none}
    .contact-field input:focus,.contact-field select:focus,.contact-field textarea:focus{border-color:#426791;box-shadow:0 0 0 3px rgba(66,103,145,.1)}
    .contact-field textarea{min-height:190px;resize:vertical;line-height:1.8}
    .required{display:inline-block;margin-left:7px;padding:2px 6px;border-radius:4px;background:#426791;color:#fff;font-size:10px;vertical-align:middle}
    .contact-consent{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.8;color:#63798e}
    .contact-consent input{margin-top:6px;accent-color:#426791}
    .contact-consent a{color:#426791}
    .contact-submit{justify-self:start;border:0;border-radius:999px;background:#426791;color:white;padding:14px 28px;font:inherit;font-size:14px;cursor:pointer;transition:transform .2s,background .2s}
    .contact-submit:hover{background:#294967;transform:translateY(-1px)}
    .contact-note{font-size:12px;color:#718398;line-height:1.8;margin-top:24px}
    @media(max-width:600px){.contact-content{width:calc(100% - 32px)}.contact-submit{width:100%}}
  </style>
</head>
<body>
  <div class="page-line"></div>
  <header><div class="header-inner">
    <a href="index.html" class="logo">Studio People</a>
    <button class="menu-button" id="menuButton" aria-label="メニュー" aria-expanded="false"><span></span><span></span><span></span></button>
  </div></header>
  <div class="menu-backdrop" id="menuBackdrop"></div>
  <nav class="menu-panel" id="menuPanel" aria-label="メインメニュー">
    <a href="index.html">HOME</a><a href="article.html">ARTICLE</a><a href="catalog.html">CATALOG</a><a href="about.html">ABOUT</a>
  </nav>
  <main>
    <section class="hero"><p class="small-title">CONTACT</p><h1>お問い合わせ</h1><p class="description">Studio Peopleへのご連絡はこちらから</p></section>
    <section class="contact-content">
      <p class="contact-intro">記事・掲載内容・サイトについてのお問い合わせを受け付けています。必要事項を入力して送信してください。</p>
      <form class="contact-form" action="https://script.google.com/macros/s/AKfycbwS_ElSWjEjrXZPxHou2bhzJX3XSTf3vCjSPE7kN9qu0L5zK5N0IfBaFbLdx9Ko9tTN/exec" method="post" target="_blank">
        <input type="hidden" name="action" value="contact">
        <div class="contact-field"><label for="contact-name">お名前 <span style="font-weight:400;color:#718398">（任意）</span></label><input id="contact-name" name="name" type="text" maxlength="100" autocomplete="name" placeholder="お名前"></div>
        <div class="contact-field"><label for="contact-email">メールアドレス<span class="required">必須</span></label><input id="contact-email" name="email" type="email" maxlength="254" autocomplete="email" required placeholder="you@example.com"></div>
        <div class="contact-field"><label for="contact-category">お問い合わせ種別</label><select id="contact-category" name="category"><option value="">選択してください</option><option>記事について</option><option>文房具の掲載・情報提供</option><option>サイトの不具合</option><option>その他</option></select></div>
        <div class="contact-field"><label for="contact-subject">件名<span class="required">必須</span></label><input id="contact-subject" name="subject" type="text" maxlength="160" required placeholder="お問い合わせの件名"></div>
        <div class="contact-field"><label for="contact-message">お問い合わせ内容<span class="required">必須</span></label><textarea id="contact-message" name="message" maxlength="5000" required minlength="5" placeholder="お問い合わせ内容をご入力ください"></textarea></div>
        <label class="contact-consent"><input type="checkbox" name="privacy_consent" value="yes" required><span><a href="privacy.html" target="_blank" rel="noopener noreferrer">プライバシーポリシー</a>を確認し、入力した情報が問い合わせへの対応に利用されることに同意します。</span></label>
        <button class="contact-submit" type="submit">お問い合わせを送信 ↗</button>
      </form>
      <p class="contact-note">送信後、受付確認メールをお送りします。返信にはお時間をいただく場合があります。個人情報やパスワードなど、必要以上に機微な情報は入力しないでください。</p>
    </section>
  </main>
  <footer class="site-footer">
    <nav class="footer-links" aria-label="フッター"><a href="company.html">会社概要・採用情報</a><span aria-hidden="true">/</span><a href="privacy.html">プライバシーポリシー</a><span aria-hidden="true">/</span><a href="contact.html">お問い合わせ</a></nav>
    <p class="footer-operator">運営者：<span class="footer-company-name">Stardio</span></p><p class="footer-copyright">© Studio People</p><p><a href="en/contact.html">English</a></p>
  </footer>
  <script>
  document.addEventListener("DOMContentLoaded",function(){
    const b=document.getElementById("menuButton"),p=document.getElementById("menuPanel"),o=document.getElementById("menuBackdrop");
    document.body.classList.add("page-loaded");
    function close(){b.classList.remove("active");p.classList.remove("active");o.classList.remove("active");b.setAttribute("aria-expanded","false")}
    b.addEventListener("click",function(){const open=p.classList.toggle("active");b.classList.toggle("active",open);o.classList.toggle("active",open);b.setAttribute("aria-expanded",String(open))});
    o.addEventListener("click",close);document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
  });
  </script>
  <script src="motion.js?v=5"></script><script src="settings.js?v=global-search-1"></script><script src="page-transition.js?v=1"></script>
</body>
</html>
