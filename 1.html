<!-- ========================================
     JavaScript
======================================== -->
<script>
    document.addEventListener(
        "DOMContentLoaded",
        function () {
            /* ========================================
               要素取得
            ======================================== */
            const menuButton =
                document.getElementById(
                    "menuButton"
                );
            const menuPanel =
                document.getElementById(
                    "menuPanel"
                );
            const menuBackdrop =
                document.getElementById(
                    "menuBackdrop"
                );
            /* ========================================
               ページ読み込み完了
            ======================================== */
            requestAnimationFrame(
                function () {
                    document.body.classList.add(
                        "page-loaded"
                    );
                }
            );
            /* ========================================
               メニューを閉じる
            ======================================== */
            function closeMenu() {
                menuButton.classList.remove(
                    "active"
                );
                menuPanel.classList.remove(
                    "active"
                );
                menuBackdrop.classList.remove(
                    "active"
                );
                menuButton.setAttribute(
                    "aria-expanded",
                    "false"
                );
            }
            /* ========================================
               ハンバーガーメニュー
            ======================================== */
            menuButton.addEventListener(
                "click",
                function () {
                    const isOpen =
                        menuPanel.classList.toggle(
                            "active"
                        );
                    menuButton.classList.toggle(
                        "active",
                        isOpen
                    );
                    menuBackdrop.classList.toggle(
                        "active",
                        isOpen
                    );
                    menuButton.setAttribute(
                        "aria-expanded",
                        String(isOpen)
                    );
                }
            );
            /* ========================================
               背景クリック
            ======================================== */
            menuBackdrop.addEventListener(
                "click",
                function () {
                    closeMenu();
                }
            );
            /* ========================================
               ESCキー
            ======================================== */
            document.addEventListener(
                "keydown",
                function (e) {
                    if (e.key === "Escape") {
                        closeMenu();
                    }
                }
            );
            /* ========================================
               ページ遷移
            ======================================== */
            const links =
                document.querySelectorAll(
                    "a[href]"
                );
            links.forEach(
                function (link) {
                    link.addEventListener(
                        "click",
                        function (e) {
                            const href =
                                link.getAttribute(
                                    "href"
                                );
                            /* 外部リンク等 */
                            if (
                                !href ||
                                href.startsWith("#") ||
                                href.startsWith("http") ||
                                href.startsWith("mailto:") ||
                                link.target === "_blank"
                            ) {
                                return;
                            }
                            /* 現在のページ */
                            const currentPage =
                                window.location.pathname
                                    .split("/")
                                    .pop();
                            if (
                                href === currentPage
                            ) {
                                return;
                            }
                            e.preventDefault();
                            closeMenu();
                            document.body.classList.add(
                                "page-leave"
                            );
                            setTimeout(
                                function () {
                                    window.location.href =
                                        href;
                                },
                                350
                            );
                        }
                    );
                }
            );
        }
    );
</script>
</body>
